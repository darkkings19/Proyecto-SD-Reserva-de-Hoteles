<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origen X - Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f7f1;
            --panel: #ffffff;
            --panel-soft: #eef3ed;
            --line: rgba(31, 41, 55, 0.14);
            --text: #172033;
            --muted: #64748b;
            --primary: #0f766e;
            --primary-strong: #0b5f59;
            --success: #10b981;
            --danger: #dc2626;
            --warning: #b45309;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Outfit", system-ui, sans-serif;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.14), transparent 28rem),
                linear-gradient(315deg, rgba(194, 65, 12, 0.11), transparent 24rem),
                var(--bg);
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(14px);
        }

        .topbar {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .brand strong {
            font-size: 1.25rem;
            letter-spacing: 0;
        }

        .brand span {
            color: var(--muted);
            font-size: 0.86rem;
        }

        nav {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-btn, button {
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 0.7rem 0.95rem;
            color: var(--text);
            background: #eef3ed;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
            transition: background 0.18s, border-color 0.18s, transform 0.08s;
        }

        .nav-btn:hover, button:hover {
            background: #e1e9e0;
            border-color: rgba(15, 118, 110, 0.24);
        }

        .nav-btn.active, .primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .primary:hover {
            background: var(--primary-strong);
            border-color: var(--primary-strong);
        }

        .danger {
            background: rgba(220, 38, 38, 0.1);
            color: #991b1b;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 1.25rem;
        }

        .view { display: none; }
        .view.active { display: block; }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.5rem;
            margin: 1rem 0 1.25rem;
        }

        h1, h2, h3, p { margin-top: 0; }

        h1 {
            font-size: clamp(2rem, 4vw, 3.25rem);
            margin-bottom: 0.4rem;
        }

        h2 { margin-bottom: 1rem; }

        .muted { color: var(--muted); }

        .grid {
            display: grid;
            gap: 1rem;
        }

        .filters {
            grid-template-columns: repeat(5, minmax(0, 1fr));
            align-items: end;
        }

        .panel, .card {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.88);
            border-radius: 8px;
            padding: 1rem;
            box-shadow: 0 18px 45px rgba(23, 32, 51, 0.08);
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 650;
            margin-bottom: 0.4rem;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text);
            padding: 0.78rem 0.85rem;
            font: inherit;
        }

        input:focus {
            outline: 2px solid rgba(15, 118, 110, 0.22);
            border-color: var(--primary);
        }

        .rooms-grid {
            margin-top: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        .room-card {
            display: flex;
            flex-direction: column;
            min-height: 245px;
        }

        .room-card h3 {
            margin-bottom: 0.25rem;
        }

        .room-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin: 1rem 0;
        }

        .metric {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 0.7rem;
        }

        .metric span {
            color: var(--muted);
            display: block;
            font-size: 0.78rem;
        }

        .metric strong {
            display: block;
            margin-top: 0.15rem;
        }

        .room-actions {
            margin-top: auto;
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }

        .room-actions button { width: 100%; }

        .two-col {
            grid-template-columns: minmax(0, 1fr) minmax(320px, 0.65fr);
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .auth-tabs button {
            width: 100%;
        }

        .form-grid {
            display: grid;
            gap: 0.85rem;
        }

        .reservation-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.8rem;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 0.25rem 0.65rem;
            background: rgba(16, 185, 129, 0.15);
            color: #047857;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .message {
            display: none;
            margin: 1rem 0;
            border-radius: 8px;
            padding: 0.85rem 1rem;
            border: 1px solid var(--line);
        }

        .message.show { display: block; }
        .message.error { background: rgba(220, 38, 38, 0.1); color: #991b1b; }
        .message.success { background: rgba(16, 185, 129, 0.14); color: #047857; }
        .message.info { background: rgba(2, 132, 199, 0.12); color: #075985; }

        .profile-row {
            border-bottom: 1px solid var(--line);
            padding: 0.8rem 0;
        }

        .profile-row:last-child { border-bottom: 0; }

        .profile-row span {
            color: var(--muted);
            display: block;
            font-size: 0.82rem;
            margin-bottom: 0.15rem;
        }

        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .filters, .two-col {
                grid-template-columns: 1fr;
            }

            .hero {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 620px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                justify-content: flex-start;
            }

            main { padding: 0.9rem; }
            .room-meta { grid-template-columns: 1fr; }
            .reservation-card { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="topbar">
            <div class="brand">
                <strong>Origen X</strong>
                <span id="sessionLabel">Explora hoteles disponibles</span>
            </div>
            <nav>
                <button class="nav-btn active" data-view="hotelsView">Hoteles</button>
                <button class="nav-btn" data-view="reservationsView">Mis reservas</button>
                <button class="nav-btn" data-view="profileView">Perfil</button>
                <button class="nav-btn" data-view="authView" id="authNav">Iniciar sesion</button>
                <button class="danger hidden" id="logoutBtn">Salir</button>
            </nav>
        </div>
    </header>

    <main>
        <section class="view active" id="hotelsView">
            <div class="hero">
                <div>
                    <h1>Hoteles y habitaciones</h1>
                </div>
            </div>

            <div class="panel">
                <div class="grid filters">
                    <div>
                        <label for="fecha_inicio">Check-in</label>
                        <input type="date" id="fecha_inicio">
                    </div>
                    <div>
                        <label for="fecha_fin">Check-out</label>
                        <input type="date" id="fecha_fin">
                    </div>
                    <div>
                        <label for="ubicacion">Ubicacion</label>
                        <input type="text" id="ubicacion" placeholder="Ciudad o zona">
                    </div>
                    <div>
                        <label for="precio_max">Precio maximo</label>
                        <input type="number" id="precio_max" min="0" value="0">
                    </div>
                    <div>
                        <label for="capacidad">Personas</label>
                        <input type="number" id="capacidad" min="0" value="0">
                    </div>
                </div>
                <button class="primary" id="searchBtn">Buscar habitaciones</button>
            </div>

            <div id="hotelMessage" class="message"></div>
            <div class="grid rooms-grid" id="roomsList"></div>
        </section>

        <section class="view" id="reservationsView">
            <div class="hero">
                <div>
                    <h1>Mis reservas</h1>
                </div>
                <button class="primary" id="refreshReservationsBtn">Actualizar</button>
            </div>
            <div id="reservationsMessage" class="message"></div>
            <div id="reservationsList"></div>
        </section>

        <section class="view" id="profileView">
            <div class="hero">
                <div>
                    <h1>Perfil</h1>
                </div>
            </div>
            <div id="profileMessage" class="message"></div>
            <div class="grid two-col">
                <div class="panel">
                    <h2>Datos del usuario</h2>
                    <div class="profile-row">
                        <span>Nombre</span>
                        <strong id="profileName">-</strong>
                    </div>
                    <div class="profile-row">
                        <span>Email</span>
                        <strong id="profileEmail">-</strong>
                    </div>
                    <div class="profile-row">
                        <span>Telefono</span>
                        <strong id="profilePhone">-</strong>
                    </div>
                    <div class="profile-row">
                        <span>ID</span>
                        <strong id="profileId">-</strong>
                    </div>
                </div>
                <form class="panel form-grid" id="profileForm">
                    <h2>Editar perfil</h2>
                    <div>
                        <label for="edit_nombre">Nombre</label>
                        <input type="text" id="edit_nombre" required>
                    </div>
                    <div>
                        <label for="edit_telefono">Telefono</label>
                        <input type="text" id="edit_telefono">
                    </div>
                    <button class="primary" type="submit">Guardar cambios</button>
                </form>
            </div>
        </section>

        <section class="view" id="authView">
            <div class="hero">
                <div>
                    <h1>Acceso</h1>
                </div>
            </div>
            <div class="grid">
                <div class="panel">
                    <div class="auth-tabs">
                        <button class="primary" id="showLoginBtn">Login</button>
                        <button id="showRegisterBtn">Registro</button>
                    </div>
                    <div id="authMessage" class="message"></div>

                    <form class="form-grid" id="loginForm">
                        <div>
                            <label for="log_email">Email</label>
                            <input type="email" id="log_email" required>
                        </div>
                        <div>
                            <label for="log_password">Password</label>
                            <input type="password" id="log_password" required>
                        </div>
                        <button class="primary" type="submit">Iniciar sesion</button>
                    </form>

                    <form class="form-grid hidden" id="registerForm">
                        <div>
                            <label for="reg_nombre">Nombre completo</label>
                            <input type="text" id="reg_nombre" required>
                        </div>
                        <div>
                            <label for="reg_email">Email</label>
                            <input type="email" id="reg_email" required>
                        </div>
                        <div>
                            <label for="reg_password">Password</label>
                            <input type="password" id="reg_password" required>
                        </div>
                        <div>
                            <label for="reg_telefono">Telefono</label>
                            <input type="text" id="reg_telefono">
                        </div>
                        <button class="primary" type="submit">Crear cuenta</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        const API_URL = "http://127.0.0.1:8080";
        const state = {
            user: null,
            rooms: [],
            activeView: "hotelsView"
        };

        const $ = (id) => document.getElementById(id);

        function setMessage(id, text, type = "info") {
            const el = $(id);
            el.className = `message ${type} show`;
            el.textContent = text;
        }

        function clearMessage(id) {
            const el = $(id);
            el.className = "message";
            el.textContent = "";
        }

        async function api(path, options = {}) {
            const headers = {
                "Content-Type": "application/json",
                ...(state.user?.access_token ? { Authorization: `Bearer ${state.user.access_token}` } : {}),
                ...(options.headers || {})
            };
            const response = await fetch(`${API_URL}${path}`, {
                headers,
                ...options
            });
            const data = await response.json().catch(() => null);
            if (!response.ok) {
                throw new Error(data?.detail || "No se pudo completar la operacion");
            }
            return data;
        }

        function saveSession(user) {
            state.user = user;
            localStorage.setItem("origen_user", JSON.stringify(user));
            renderSession();
        }

        function clearSession() {
            state.user = null;
            localStorage.removeItem("origen_user");
            renderSession();
        }

        function renderSession() {
            const isLogged = Boolean(state.user);
            $("logoutBtn").classList.toggle("hidden", !isLogged);
            $("authNav").textContent = isLogged ? "Perfil" : "Iniciar sesion";
            $("authNav").dataset.view = isLogged ? "profileView" : "authView";
            $("sessionLabel").textContent = isLogged
                ? `Sesion iniciada como ${state.user.nombre}`
                : "Explora hoteles disponibles";

            if (isLogged) {
                renderProfile(state.user);
            } else {
                renderProfile(null);
            }
        }

        function showView(viewId) {
            state.activeView = viewId;
            document.querySelectorAll(".view").forEach(view => view.classList.toggle("active", view.id === viewId));
            document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.view === viewId));

            if (viewId === "reservationsView") {
                loadReservations();
            }
            if (viewId === "profileView" && !state.user) {
                setMessage("profileMessage", "Inicia sesion para ver tu perfil.", "info");
            }
        }

        function validateDates() {
            const start = $("fecha_inicio").value;
            const end = $("fecha_fin").value;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const startDate = parseDateInput(start);
            const endDate = parseDateInput(end);

            if (!start || !end) return "Selecciona fecha de inicio y fin.";
            if (startDate < today) return "La fecha de inicio no puede estar en el pasado.";
            if (endDate <= startDate) return "La fecha de fin debe ser posterior al check-in.";
            return "";
        }

        function parseDateInput(value) {
            const [year, month, day] = value.split("-").map(Number);
            return new Date(year, month - 1, day);
        }

        async function searchRooms() {
            clearMessage("hotelMessage");
            const dateError = validateDates();
            if (dateError) {
                setMessage("hotelMessage", dateError, "error");
                return;
            }

            $("searchBtn").disabled = true;
            $("searchBtn").textContent = "Buscando...";
            try {
                const data = await api("/api/inventory/search", {
                    method: "POST",
                    body: JSON.stringify({
                        fecha_inicio: $("fecha_inicio").value,
                        fecha_fin: $("fecha_fin").value,
                        ubicacion: $("ubicacion").value.trim(),
                        precio_max: Number($("precio_max").value || 0),
                        capacidad: Number($("capacidad").value || 0)
                    })
                });
                state.rooms = data.rooms || [];
                renderRooms();
                if (state.rooms.length === 0) {
                    setMessage("hotelMessage", "No hay habitaciones disponibles para esos filtros.", "info");
                }
            } catch (error) {
                setMessage("hotelMessage", error.message, "error");
            } finally {
                $("searchBtn").disabled = false;
                $("searchBtn").textContent = "Buscar habitaciones";
            }
        }

        function renderRooms() {
            const list = $("roomsList");
            list.innerHTML = "";

            state.rooms.forEach(room => {
                const card = document.createElement("article");
                card.className = "card room-card";
                card.innerHTML = `
                    <h3>${room.nombre_hotel}</h3>
                    <p class="muted">${room.room_type_name || "Habitacion"}</p>
                    <div class="room-meta">
                        <div class="metric"><span>Precio noche</span><strong>$${Number(room.precio_noche).toFixed(2)}</strong></div>
                        <div class="metric"><span>Capacidad</span><strong>${room.capacidad} personas</strong></div>
                        <div class="metric"><span>Disponibles</span><strong>${room.stock_disponible}</strong></div>
                        <div class="metric"><span>Habitacion</span><strong>${room.room_type_id}</strong></div>
                    </div>
                    <div class="room-actions">
                        <button class="primary" ${room.stock_disponible <= 0 ? "disabled" : ""}>Reservar</button>
                    </div>
                `;
                card.querySelector("button").addEventListener("click", () => reserveRoom(room));
                list.appendChild(card);
            });
        }

        async function reserveRoom(room) {
            clearMessage("hotelMessage");
            if (!state.user) {
                setMessage("hotelMessage", "Inicia sesion para reservar esta habitacion.", "info");
                showView("authView");
                return;
            }

            const dateError = validateDates();
            if (dateError) {
                setMessage("hotelMessage", dateError, "error");
                return;
            }

            try {
                const reservation = await api("/reservations", {
                    method: "POST",
                    body: JSON.stringify({
                        hotel_id: room.hotel_id,
                        room_type_id: room.room_type_id,
                        fecha_inicio: $("fecha_inicio").value,
                        fecha_fin: $("fecha_fin").value
                    })
                });
                setMessage("hotelMessage", `Reserva creada correctamente: ${reservation.reservation_id}`, "success");
                await searchRooms();
            } catch (error) {
                setMessage("hotelMessage", error.message, "error");
            }
        }

        async function loadReservations() {
            clearMessage("reservationsMessage");
            const list = $("reservationsList");
            list.innerHTML = "";

            if (!state.user) {
                setMessage("reservationsMessage", "Inicia sesion para ver tus reservas.", "info");
                return;
            }

            try {
                const reservations = await api("/reservations");
                if (reservations.length === 0) {
                    setMessage("reservationsMessage", "Aun no tienes reservas.", "info");
                    return;
                }
                reservations.forEach(res => {
                    const card = document.createElement("article");
                    card.className = "panel reservation-card";
                    card.innerHTML = `
                        <div>
                            <h3>${res.hotel_id} - ${res.room_type_id}</h3>
                            <p class="muted">Monto: $${Number(res.monto_total).toFixed(2)}</p>
                            <p class="muted">Reserva: ${res.reservation_id}</p>
                        </div>
                        <span class="badge">${res.status}</span>
                    `;
                    list.appendChild(card);
                });
            } catch (error) {
                setMessage("reservationsMessage", error.message, "error");
            }
        }

        function renderProfile(user) {
            $("profileName").textContent = user?.nombre || "-";
            $("profileEmail").textContent = user?.email || "-";
            $("profilePhone").textContent = user?.telefono || "Sin telefono";
            $("profileId").textContent = user?.id || "-";
            $("edit_nombre").value = user?.nombre || "";
            $("edit_telefono").value = user?.telefono || "";
        }

        async function loadProfile() {
            if (!state.user) return;
            try {
                const profile = await api(`/users/${encodeURIComponent(state.user.id)}`);
                saveSession({ ...state.user, ...profile });
                clearMessage("profileMessage");
            } catch (error) {
                setMessage("profileMessage", error.message, "error");
            }
        }

        async function updateProfile(event) {
            event.preventDefault();
            clearMessage("profileMessage");
            if (!state.user) {
                setMessage("profileMessage", "Inicia sesion para editar tu perfil.", "info");
                return;
            }
            try {
                const profile = await api(`/users/${encodeURIComponent(state.user.id)}`, {
                    method: "PUT",
                    body: JSON.stringify({
                        nombre: $("edit_nombre").value.trim(),
                        telefono: $("edit_telefono").value.trim()
                    })
                });
                saveSession({ ...state.user, ...profile });
                setMessage("profileMessage", "Perfil actualizado correctamente.", "success");
            } catch (error) {
                setMessage("profileMessage", error.message, "error");
            }
        }

        async function login(event) {
            event.preventDefault();
            clearMessage("authMessage");
            try {
                const user = await api("/login", {
                    method: "POST",
                    body: JSON.stringify({
                        email: $("log_email").value.trim(),
                        password: $("log_password").value
                    })
                });
                saveSession(user);
                await loadProfile();
                setMessage("hotelMessage", "Sesion iniciada. Ya puedes reservar.", "success");
                showView("hotelsView");
            } catch (error) {
                setMessage("authMessage", error.message, "error");
            }
        }

        async function register(event) {
            event.preventDefault();
            clearMessage("authMessage");
            try {
                await api("/users", {
                    method: "POST",
                    body: JSON.stringify({
                        nombre: $("reg_nombre").value.trim(),
                        email: $("reg_email").value.trim(),
                        password: $("reg_password").value,
                        telefono: $("reg_telefono").value.trim()
                    })
                });
                setMessage("authMessage", "Cuenta creada. Ahora inicia sesion.", "success");
                showAuthForm("login");
                $("log_email").value = $("reg_email").value.trim();
                $("registerForm").reset();
            } catch (error) {
                setMessage("authMessage", error.message, "error");
            }
        }

        async function logout() {
            const token = state.user?.access_token;
            if (token) {
                try {
                    await api("/logout", {
                        method: "POST",
                        body: JSON.stringify({ access_token: token })
                    });
                } catch (error) {
                    console.error("Error cerrando sesion", error);
                }
            }
            clearSession();
            $("reservationsList").innerHTML = "";
            setMessage("hotelMessage", "Sesion cerrada.", "info");
            showView("hotelsView");
        }

        async function restoreSession() {
            const saved = localStorage.getItem("origen_user");
            if (!saved) {
                renderSession();
                return;
            }
            try {
                const user = JSON.parse(saved);
                if (!user.access_token) {
                    clearSession();
                    return;
                }
                const validated = await api("/validate-token", {
                    method: "POST",
                    body: JSON.stringify({ access_token: user.access_token })
                });
                saveSession({ ...user, ...validated, access_token: user.access_token });
                await loadProfile();
            } catch (error) {
                clearSession();
            }
        }

        function showAuthForm(kind) {
            const loginVisible = kind === "login";
            $("loginForm").classList.toggle("hidden", !loginVisible);
            $("registerForm").classList.toggle("hidden", loginVisible);
            $("showLoginBtn").classList.toggle("primary", loginVisible);
            $("showRegisterBtn").classList.toggle("primary", !loginVisible);
        }

        function setDefaultDates() {
            const today = new Date();
            const end = new Date(today);
            end.setDate(today.getDate() + 2);
            $("fecha_inicio").value = formatDateInput(today);
            $("fecha_fin").value = formatDateInput(end);
        }

        function formatDateInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.addEventListener("click", () => showView(btn.dataset.view));
        });
        $("searchBtn").addEventListener("click", searchRooms);
        $("refreshReservationsBtn").addEventListener("click", loadReservations);
        $("profileForm").addEventListener("submit", updateProfile);
        $("loginForm").addEventListener("submit", login);
        $("registerForm").addEventListener("submit", register);
        $("logoutBtn").addEventListener("click", logout);
        $("showLoginBtn").addEventListener("click", () => showAuthForm("login"));
        $("showRegisterBtn").addEventListener("click", () => showAuthForm("register"));

        setDefaultDates();
        restoreSession();
        searchRooms();
    </script>
</body>
</html>
