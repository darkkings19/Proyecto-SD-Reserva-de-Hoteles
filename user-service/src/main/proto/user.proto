syntax = "proto3";

package pb;

option java_multiple_files = true;
option java_package = "com.sde.user.grpc";
option java_outer_classname = "UserProto";

enum Role {
    ROLE_UNSPECIFIED = 0;
    CLIENTE = 1;
    ADMINISTRADOR = 2;
}

message User {
    string id = 1;
    string nombre = 2;
    string email = 3;
    Role rol = 4;
    string telefono = 5;
    string created_at = 6;
}

message CreateUserRequest {
    string nombre = 1;
    string email = 2;
    string password = 3;
    Role rol = 4;
    string telefono = 5;
}

message GetUserRequest {
    string id = 1;
}

message UpdateUserRequest {
    string id = 1;
    string nombre = 2;
    string telefono = 3;
}

message AuthenticateUserRequest {
    string email = 1;
    string password = 2;
}

message LogoutRequest {
    string access_token = 1;
}

message ValidateTokenRequest {
    string access_token = 1;
}

message UserResponse {
    User user = 1;
}

message AuthenticateUserResponse {
    bool success = 1;
    User user = 2;
    string access_token = 3;
    string expires_at = 4;
}

message SessionResponse {
    bool success = 1;
    User user = 2;
    string expires_at = 3;
}

service UserService {
    rpc CreateUser (CreateUserRequest) returns (UserResponse);
    rpc GetUser (GetUserRequest) returns (UserResponse);
    rpc UpdateUser (UpdateUserRequest) returns (UserResponse);
    rpc AuthenticateUser (AuthenticateUserRequest) returns (AuthenticateUserResponse);
    rpc LogoutUser (LogoutRequest) returns (SessionResponse);
    rpc ValidateToken (ValidateTokenRequest) returns (SessionResponse);
}
