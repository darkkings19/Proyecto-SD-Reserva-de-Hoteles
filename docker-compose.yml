services:
  # ----------------------------------------
  # BASES DE DATOS AISLADAS
  # ----------------------------------------
  notificaciones_db:
    image: postgres:15-alpine
    container_name: notificaciones_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NOTIFICACIONES_NAME:-notificaciones_db}
    networks:
      - origen-net
    volumes:
      - notificaciones_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NOTIFICACIONES_NAME:-notificaciones_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  reservas_db:
    image: postgres:15-alpine
    container_name: reservas_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_RESERVAS_NAME:-reservas_service}
    networks:
      - origen-net
    volumes:
      - reservas_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_RESERVAS_NAME:-reservas_service}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventario_db:
    image: postgres:15-alpine
    container_name: inventario_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: inventario_db
    networks:
      - origen-net
    volumes:
      - inventario_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d inventario_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  users-db:
    image: postgres:15-alpine
    container_name: users-db
    environment:
      POSTGRES_DB: ${DB_USER_NAME:-user_db}
      POSTGRES_USER: ${DB_USER:-sde_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sde_password}
    networks:
      - origen-net
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sde_user} -d ${DB_USER_NAME:-user_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # MENSAJERIA TRANSVERSAL
  # ----------------------------------------
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - origen-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8082:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=origen-x
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    networks:
      - origen-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------------------------
  # MICROSERVICIOS
  # ----------------------------------------
  notification_service:
    build:
      context: ./notification_service
    container_name: notification_service
    environment:
      - PORT=50051
      - DB_HOST=notificaciones_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NOTIFICACIONES_NAME:-notificaciones_db}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      - DEFAULT_USER_EMAIL=${DEFAULT_USER_EMAIL:-e.loren01@ufromail.cl}
      - USER_SERVICE_HOST=${USER_SERVICE_HOST}
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_RESERVATIONS_TOPIC=${KAFKA_RESERVATIONS_TOPIC:-origenx.reservations.events}
      - KAFKA_NOTIFICATIONS_TOPIC=${KAFKA_NOTIFICATIONS_TOPIC:-origenx.notifications.events}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-notification-service}
      - KAFKA_CLIENT_ID=notification-service
      - METRICS_PORT=9104
      - OTEL_SERVICE_NAME=notification-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    ports:
      - "9104:9104"
    networks:
      - origen-net
    depends_on:
      notificaciones_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  reservation_service:
    build:
      context: ./mi-servicio
    container_name: reservation_service
    ports:
      - "50052:50052"
      - "9102:9102"
    environment:
      - PORT=50052
      - METRICS_PORT=9102
      - RESERVAS_DB_HOST=reservas_db
      - RESERVAS_DB_PORT=5432
      - RESERVAS_DB_USER=${DB_USER:-postgres}
      - RESERVAS_DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RESERVAS_DB_NAME=${DB_RESERVAS_NAME:-reservas_service}
      - NOTIFICATION_SERVICE_HOST=notification_service:50051
      - INVENTORY_SERVICE_HOST=inventario_service:50053
      - USER_SERVICE_HOST=user-service:9090
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_RESERVATIONS_TOPIC=${KAFKA_RESERVATIONS_TOPIC:-origenx.reservations.events}
      - KAFKA_CLIENT_ID=reservation-service
      - OTEL_SERVICE_NAME=reservation-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    networks:
      - origen-net
    depends_on:
      reservas_db:
        condition: service_healthy
    restart: unless-stopped

  inventario_service:
    build:
      context: ./inventario-service
    container_name: inventario_service
    ports:
      - "50053:50053"
      - "9103:9103"
    environment:
      - PORT=50053
      - METRICS_PORT=9103
      - DB_HOST=inventario_db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=inventario_db
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_INVENTORY_TOPIC=${KAFKA_INVENTORY_TOPIC:-origenx.inventory.events}
      - KAFKA_CLIENT_ID=inventario-service
      - OTEL_SERVICE_NAME=inventory-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    networks:
      - origen-net
    depends_on:
      inventario_db:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    ports:
      - "9090:9090"
      - "8081:8080"
    environment:
      - DB_HOST=users-db
      - DB_PORT=5432
      - DB_NAME=${DB_USER_NAME:-user_db}
      - DB_USER=${DB_USER:-sde_user}
      - DB_PASSWORD=${DB_PASSWORD:-sde_password}
      - GRPC_PORT=9090
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_USERS_TOPIC=${KAFKA_USERS_TOPIC:-origenx.users.events}
      - KAFKA_CLIENT_ID=user-service
      - OTEL_SERVICE_NAME=user-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    networks:
      - origen-net
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - origen-net
    depends_on:
      - user-service
      - reservation_service
      - inventario_service
      - notification_service
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.10
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - origen-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail.yml
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - origen-net
    depends_on:
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    user: "0"
    command: -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    networks:
      - origen-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/otel-collector.yml"]
    ports:
      - "4319:4317"
      - "4320:4318"
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/otel-collector.yml:ro
    networks:
      - origen-net
    depends_on:
      - tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_DEFAULT_THEME=light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - origen-net
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  api_gateway:
    build:
      context: ./api-gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    environment:
      - RESERVATION_SERVICE_HOST=reservation_service:50052
      - NOTIFICATION_SERVICE_HOST=notification_service:50051
      - INVENTORY_SERVICE_HOST=inventario_service:50053
      - USER_SERVICE_HOST=user-service:9090
      - KAFKA_ENABLED=${KAFKA_ENABLED:-true}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_GATEWAY_TOPIC=${KAFKA_GATEWAY_TOPIC:-origenx.gateway.events}
      - KAFKA_CLIENT_ID=api-gateway
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    networks:
      - origen-net
    depends_on:
      - notification_service
      - reservation_service
      - inventario_service
      - user-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    networks:
      - origen-net
    depends_on:
      - api_gateway
    restart: unless-stopped

networks:
  origen-net:
    driver: bridge

volumes:
  notificaciones_data:
  reservas_data:
  inventario_data:
  users_pgdata:
  grafana_data:
  loki_data:
  tempo_data:
